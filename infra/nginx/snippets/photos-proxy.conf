# Body of the generated `location ^~ /<photos bucket>/` on :9443.
# Browsers only read pre-signed objects; uploads go through the API.
limit_except GET HEAD { deny all; }
limit_req zone=sp_photos burst=200 nodelay;

proxy_http_version 1.1;
proxy_set_header Connection        "";
# $http_host keeps ":9443" — it is part of the pre-signed signature.
# No X-Forwarded-Host/Port here for the same reason.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;

# Hide storage implementation details.
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-id-2;
proxy_hide_header X-Amz-Bucket-Region;
proxy_hide_header X-Xss-Protection;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Content-Security-Policy;

include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/headers-photos.conf;

proxy_pass http://minio_backend;
