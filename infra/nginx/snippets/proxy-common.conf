# Proxy settings repeated in every location (INF-N1): any proxy_set_header in
# a location replaces ALL inherited ones, so the full set lives here.
# The Host header is set by each location (photos need $http_host).
# X-Forwarded-For is the client address only — a client-supplied header is
# never appended; the API trusts X-Real-IP from TRUSTED_PROXIES only.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_connect_timeout 10s;
