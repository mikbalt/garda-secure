# Objects are evidence photos: if one is opened directly it must never run
# script (an uploaded SVG/HTML file), nor be framed by another site.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header X-Frame-Options "DENY" always;
