# Web app (SPA) responses: the edge is authoritative for security headers, so
# the web container's own copies are hidden to avoid duplicates.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;

include /etc/nginx/snippets/security-headers.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
# img-src: pre-signed photo URLs are served by this host on :9443 ($host is
# the name the browser used, i.e. SERVER_HOST). Keycloak is same-origin
# (/auth), so connect-src/frame-src 'self' cover login, token refresh and
# logout. style-src needs 'unsafe-inline' for chart/inline style attributes.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://$host:9443; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
