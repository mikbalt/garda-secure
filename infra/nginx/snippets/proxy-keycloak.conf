# Keycloak (/auth). Keycloak sends its own realm-configurable CSP,
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy for its login,
# account and admin pages — they are kept (an extra edge CSP would break the
# admin console). Only its HSTS (which has includeSubDomains) is replaced.
# Keycloak 26 (KC_PROXY_HEADERS=xforwarded) also reads X-Forwarded-Prefix;
# Keycloak is served under the same /auth path, so a client-supplied one is
# dropped (empty value = header not sent). X-Forwarded-For/Proto/Host/Port
# are overwritten in proxy-common.conf.
proxy_set_header X-Forwarded-Prefix "";
proxy_buffer_size       128k;
proxy_buffers           4 256k;
proxy_busy_buffers_size 256k;
proxy_read_timeout      120s;

proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
