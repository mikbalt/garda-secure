# Baseline security headers for every TLS response (INF-N4).
# nginx does not inherit add_header into a location that defines its own,
# so the headers-*.conf snippets include this file again.
# HSTS without includeSubDomains: other hosts of the customer's domain may
# still be HTTP-only. Add it (and preload) only when that is known to be safe.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
