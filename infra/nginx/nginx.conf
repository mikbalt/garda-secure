# Public TLS reverse proxy (production). Server blocks:
#   :80   -> redirect to HTTPS (+ ACME webroot, local health)
#   :443  -> web app, /api (API), /auth (Keycloak)
#   :9443 -> pre-signed photo URLs (photos bucket only, GET/HEAD)
# Shared pieces live in snippets/; /etc/nginx/generated/ is written at start
# by docker-entrypoint.d/40-securepatrol.sh (admin allow-list, photos bucket).
# CI runs `nginx -t` on this file (ci-infra.yml).
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Photo uploads from tablets are up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/csv application/json application/javascript
               application/xml image/svg+xml;

    # Docker's embedded DNS: upstream names are re-resolved every 10 s, so a
    # recreated container (new IP) does not cause 502s (INF-D5).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/snippets/tls.conf;

    # ── Rate limits (INF-N4) ─────────────────────────────────────────────────
    # Generous for tablets (offline outbox replays burst after reconnecting);
    # SOS is never limited. Keyed on the client address.
    limit_req_zone $binary_remote_addr zone=sp_api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sp_token:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=sp_auth:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=sp_photos:10m rate=50r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # ── Upstreams (resolved at runtime via `resolve`, nginx >= 1.27.3) ───────
    upstream api_backend {
        zone api_backend 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    upstream web_frontend {
        zone web_frontend 64k;
        server web:80 resolve;
        keepalive 16;
    }

    upstream keycloak_backend {
        zone keycloak_backend 64k;
        server keycloak:8080 resolve;
        keepalive 16;
    }

    upstream minio_backend {
        zone minio_backend 64k;
        server minio:9000 resolve;
        keepalive 16;
    }

    # ── HTTP → HTTPS ─────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Optional ACME (certbot webroot), see runbook §6.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container healthcheck (nginx itself, no upstream).
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main site: web app, API, Keycloak ────────────────────────────────────
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        include /etc/nginx/snippets/security-headers.conf;

        # Never expose metrics through the public proxy (API metrics live on
        # api:8080/metrics, Keycloak 24 serves /auth/metrics and /auth/health
        # on its main port).
        location = /metrics          { return 404; }
        location ^~ /api/metrics     { return 404; }
        location ^~ /auth/metrics    { return 404; }
        location ^~ /auth/health     { return 404; }

        # API liveness/readiness (status only, no details) for uptime checks.
        location = /health {
            access_log off;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header Host $host;
            proxy_pass http://api_backend;
        }
        location = /ready {
            access_log off;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header Host $host;
            proxy_pass http://api_backend;
        }

        # SOS must never be rate limited.
        location = /api/v1/sos {
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/headers-api.conf;
            proxy_set_header Host $host;
            proxy_pass http://api_backend;
        }

        # REST API — the /api prefix is kept (the API serves /api/v1/...).
        location /api/ {
            limit_req zone=sp_api burst=200 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/headers-api.conf;
            proxy_set_header Host $host;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_pass http://api_backend;
        }

        # Keycloak admin console + admin REST API and the master realm: only
        # from ADMIN_ALLOW_CIDRS (INF-N2). Everything else of Keycloak (client
        # realms' login pages, tokens, account console) stays public.
        location ^~ /auth/admin/ {
            include /etc/nginx/generated/admin-allow.conf;
            limit_req zone=sp_auth burst=100 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keycloak.conf;
            proxy_set_header Host $host;
            proxy_pass http://keycloak_backend;
        }
        location ^~ /auth/realms/master/ {
            include /etc/nginx/generated/admin-allow.conf;
            limit_req zone=sp_token burst=20 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keycloak.conf;
            proxy_set_header Host $host;
            proxy_pass http://keycloak_backend;
        }

        # Token endpoint (password grant of tablets, code exchange, refresh):
        # brute-force brake on top of Keycloak's own lockout.
        location ~ ^/auth/realms/[^/]+/protocol/openid-connect/token$ {
            limit_req zone=sp_token burst=30 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keycloak.conf;
            proxy_set_header Host $host;
            proxy_pass http://keycloak_backend;
        }

        # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so the path is kept.
        location /auth/ {
            limit_req zone=sp_auth burst=100 nodelay;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keycloak.conf;
            proxy_set_header Host $host;
            proxy_pass http://keycloak_backend;
        }

        # Web SPA (the web container does the index.html fallback itself).
        location / {
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/headers-app.conf;
            proxy_set_header Host $host;
            proxy_pass http://web_frontend;
        }
    }

    # ── Object storage for pre-signed photo URLs ─────────────────────────────
    # Only GET/HEAD on the photos bucket (INF-N3). The Host header is passed
    # through unchanged ($http_host incl. :9443) so the pre-signed signature,
    # computed for MINIO_PUBLIC_ENDPOINT = <SERVER_HOST>:9443, stays valid.
    server {
        listen 9443 ssl default_server;
        http2 on;
        server_name _;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/headers-photos.conf;

        # location ^~ /<MINIO_BUCKET_PHOTOS>/ { ... } — generated at start.
        include /etc/nginx/generated/photos-location.conf;

        # Everything else (other buckets, /minio/health, /minio/v2/metrics,
        # bucket listing at /) is refused.
        location / {
            return 403;
        }
    }
}
