user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Photo uploads from tablets are up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/csv application/json application/javascript
               application/xml image/svg+xml;

    # Shared TLS settings (self-signed for dev; replace with real certs in prod)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    upstream api_backend {
        server api:8080;
        keepalive 32;
    }

    upstream web_frontend {
        server web:80;
        keepalive 16;
    }

    upstream keycloak_backend {
        server keycloak:8080;
        keepalive 16;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 16;
    }

    # ── HTTP → HTTPS ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main site: web app, API, Keycloak ────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # REST API — the /api prefix is kept (the API serves /api/v1/...).
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_set_header   Connection "";
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
        }

        location = /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so the path is kept.
        location /auth/ {
            proxy_pass         http://keycloak_backend;
            proxy_set_header   Connection "";
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout      120s;
        }

        # Web SPA (the web container does the index.html fallback itself).
        location / {
            proxy_pass         http://web_frontend;
            proxy_set_header   Connection "";
        }
    }

    # ── MinIO for pre-signed photo URLs ──────────────────────────────────────
    # The Host header is passed through unchanged so the pre-signed signature
    # (computed for MINIO_PUBLIC_ENDPOINT = <host>:9443) stays valid.
    server {
        listen 9443 ssl;
        server_name _;

        location / {
            proxy_pass         http://minio_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            # Only object reads are expected from browsers.
            limit_except GET HEAD { deny all; }
        }
    }
}
