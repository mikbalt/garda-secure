# Local override: remap ports that conflict with Zscaler VPN (port 9000).
# Usage: append it to COMPOSE_FILE in infra/.env, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.app.yml:docker-compose.ops.yml:docker-compose.local.yml
# (the former healthcheck overrides are gone: the base files now probe
# 127.0.0.1 instead of localhost — INF-D1).
services:
  minio:
    ports: !override
      - "127.0.0.1:9002:9000"  # Zscaler occupies 9000; use 9002 for local S3 access
      - "127.0.0.1:9001:9001"  # console unchanged
