global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'securepatrol'

# Postgres/Redis need exporters (postgres_exporter, redis_exporter) to be
# scraped; the API /metrics endpoint is on the backlog (PROGRESS.md).
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
