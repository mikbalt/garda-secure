# docker-compose.app.yml — overlay for built app services
# Usage: docker-compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# Requires docker buildx (Docker Desktop >= 4.x) or plain docker build.
# Infra services (postgres, redis, minio, keycloak, nginx, grafana, prometheus)
# come from docker-compose.yml; only app-specific services are here.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      PORT: ${API_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - securepatrol

  notification-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: ["./securepatrol", "worker"]
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securepatrol

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - securepatrol
