# docker-compose.app.yml — overlay for the application services.
# Usage (from infra/):
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# Infra services (postgres, redis, minio, keycloak, nginx, grafana, prometheus)
# come from docker-compose.yml; this file adds api, worker and web and switches
# nginx to the full TLS config.

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
  MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-true}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_PHOTOS: ${MINIO_BUCKET_PHOTOS}
  MINIO_BUCKET_BACKUPS: ${MINIO_BUCKET_BACKUPS}
  KEYCLOAK_URL: http://keycloak:8080/auth
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
  KEYCLOAK_REALMS: ${KEYCLOAK_REALMS}
  APP_PUBLIC_URL: ${PUBLIC_URL}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v18.0}
  WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-id}
  BACKUP_HOUR: ${BACKUP_HOUR:-2}
  TZ: ${TZ:-Asia/Jakarta}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: securepatrol/api:${VERSION:-dev}
    restart: always
    environment:
      <<: *backend-env
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - securepatrol

  notification-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: securepatrol/api:${VERSION:-dev}
    restart: always
    command: ["worker"]
    environment:
      <<: *backend-env
    depends_on:
      api:
        condition: service_healthy # api applies migrations first
    networks:
      - securepatrol

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: securepatrol/web:${VERSION:-dev}
    restart: always
    environment:
      # Runtime config written to /config.js at container start.
      API_URL: /api/v1
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_CLIENT_ID: securepatrol-web
      KEYCLOAK_REALMS: ${WEB_KEYCLOAK_REALMS}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - securepatrol

  nginx:
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports: !override
      - "80:80"
      - "443:443"
      - "9443:9443" # MinIO pre-signed photo URLs over TLS
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
