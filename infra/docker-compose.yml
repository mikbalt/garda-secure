# Infrastructure services. Alone (`make up-infra`, i.e.
# `docker compose -f docker-compose.yml up -d`) for local backend/web
# development; in production COMPOSE_FILE in .env adds docker-compose.app.yml
# (api, worker, web, TLS nginx) and docker-compose.ops.yml (monitoring,
# off-site backup), so a plain `docker compose up -d` starts everything.
#
# Images are pinned to a minor/patch version (Dependabot proposes updates).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16.15-alpine
    restart: always
    <<: *hardening
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by postgres/init/01-roles.sh on the first start only.
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      PG_MONITOR_PASSWORD: ${PG_MONITOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432" # local dev / admin only; not exposed on the LAN
    healthcheck:
      # TCP on 127.0.0.1: the init-time server listens on the socket only, so
      # this stays unhealthy until the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - securepatrol

  redis:
    image: redis:7.4.11-alpine
    restart: always
    <<: *hardening
    logging: *logging
    # The password goes into a 0600 config file instead of the command line
    # (argv is visible to every user on the host via ps).
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - securepatrol

  # MinIO-compatible object storage. MinIO Inc. stopped publishing community
  # images (minio/minio is gone from Docker Hub), so this is the maintained
  # community fork "Silo" by Pigsty (same MINIO_* env, /minio/* routes and
  # data format), pinned by digest. See docs/runbook.md §9 for alternatives.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: always
    <<: *hardening
    logging: *logging
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Metrics stay on the internal network: nginx :9443 only proxies the
      # photos bucket, the S3 port is bound to 127.0.0.1.
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_BROWSER_REDIRECT: "false"
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"  # S3 API; browsers reach photos through nginx :9443
      - "127.0.0.1:9001:9001"  # console (SSH tunnel)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - securepatrol

  # One-shot: buckets, versioning, retention lifecycle and (opt-in)
  # least-privilege users. Idempotent; runs on every `up`.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    <<: *hardening
    logging: *logging
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MC_HOST_sp: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      MINIO_BUCKET_PHOTOS: ${MINIO_BUCKET_PHOTOS}
      MINIO_BUCKET_BACKUPS: ${MINIO_BUCKET_BACKUPS}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-}
      MINIO_OFFSITE_ACCESS_KEY: ${MINIO_OFFSITE_ACCESS_KEY:-}
      MINIO_OFFSITE_SECRET_KEY: ${MINIO_OFFSITE_SECRET_KEY:-}
    volumes:
      - ./minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - securepatrol

  keycloak:
    # Keycloak 26 (D-034 / runbook §2). The first start of a new minor
    # migrates the Keycloak database schema one way: take `make backup-db`
    # first (deploy.sh does) — rollback = old image + that dump.
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    restart: always
    <<: *hardening
    logging: *logging
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1536m}
    # `start` (production mode) behind the TLS-terminating nginx. The stock
    # image re-augments itself on start for the build options below (KC_DB,
    # health, metrics; ~30 s). Realms in ./keycloak/realms are imported only
    # when they do not exist yet — afterwards `make keycloak-config` keeps
    # redirect URIs / MFA / scopes in sync.
    command: ["start", "--import-realm"]
    environment:
      # Temporary admin of the master realm, created only on the very first
      # start (empty database); ignored afterwards (runbook §2).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Plain HTTP on 8080 behind nginx (edge TLS termination), under /auth.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Only nginx (and 127.0.0.1:8081) can reach Keycloak, and only the
      # stack's network may send X-Forwarded-* (nginx overwrites them).
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${SP_DOCKER_SUBNET:-172.28.0.0/24},127.0.0.1
      # Hostname v2: the full public URL incl. /auth. Must equal the API's
      # KEYCLOAK_PUBLIC_URL — it is the token issuer for every request, also
      # for back-channel calls of the API via http://keycloak:8080/auth
      # (hostname-backchannel-dynamic stays false). The admin console uses
      # the same URL (no KC_HOSTNAME_ADMIN).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      # Health and metrics live on the management port 9000 (same /auth
      # prefix: /auth/health/ready, /auth/metrics); never published or
      # proxied — only the healthcheck and Prometheus use it.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      TZ: UTC
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8080" # local dev / SSH tunnel; use https://<host>/auth otherwise
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 opens its ports while it is still migrating/importing;
      # only /health/ready (management port) says it is serving.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - securepatrol

  # Infra-only mode placeholder; docker-compose.app.yml swaps in the TLS
  # config and public ports.
  nginx:
    image: nginx:1.30-alpine
    restart: always
    <<: *hardening
    logging: *logging
    volumes:
      - ./nginx/nginx-infra-only.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:80:80"
    networks:
      - securepatrol

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  securepatrol:
    driver: bridge
    ipam:
      config:
        - subnet: ${SP_DOCKER_SUBNET:-172.28.0.0/24}
