# Security headers of the web container (WEB-2). Included in every location
# that sets its own headers (nginx does not inherit add_header there).
# Keep in sync with infra/nginx/snippets/headers-app.conf.
# img-src: pre-signed photo URLs come from the same host on :9443.
# No HSTS here: this container speaks plain HTTP behind the TLS edge.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://$host:9443; connect-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
