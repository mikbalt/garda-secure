# Web container (static SPA). Safe on its own (WEB-2): the security headers
# are also set here, the public edge nginx (infra/nginx) replaces them with
# its own identical set when proxying.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/web-security-headers.conf;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime configuration, generated at container start into a writable
    # path (the root fs is read-only in production) — never cache.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No cache for index.html
    location = /index.html {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Push service worker (public/sw.js): always revalidated so a release
    # reaches every browser; served from the root so its scope is "/".
    location = /sw.js {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Cache hashed static assets immutably
    location /assets/ {
        expires max;
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
