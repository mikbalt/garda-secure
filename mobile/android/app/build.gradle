plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing (MOB-7). android/key.properties (never committed; CI writes
// it from secrets) holds storeFile (relative to android/app), storePassword,
// keyAlias and keyPassword. Without it a release build FAILS instead of being
// signed with the debug key. For a local `flutter run --release` only, set
// SP_ALLOW_DEBUG_SIGNING=true (or the Gradle property allowDebugSigning=true).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}
def allowDebugSigning = (project.findProperty("allowDebugSigning") ?: System.getenv("SP_ALLOW_DEBUG_SIGNING") ?: "false").toString().toBoolean()

// Push (Firebase Cloud Messaging) is configured with --dart-define values
// (SP_FCM_*), not with google-services.json / the Google Services plugin.
// Flutter hands the defines to Gradle base64-encoded in `dart-defines`. The
// Android values are also written as the string resources that plugin would
// generate, so Firebase's init provider creates the default app when a push
// starts the process (app not running). Without the defines nothing is added
// and the app runs without push.
def dartDefines = [:]
if (project.hasProperty("dart-defines")) {
    project.property("dart-defines").toString().split(",").each { entry ->
        if (entry) {
            def pair = new String(entry.decodeBase64(), "UTF-8").split("=", 2)
            if (pair.length == 2) dartDefines[pair[0]] = pair[1]
        }
    }
}
def fcmResources = [
    google_app_id      : dartDefines["SP_FCM_APP_ID"],
    google_api_key     : dartDefines["SP_FCM_API_KEY"],
    gcm_defaultSenderId: dartDefines["SP_FCM_SENDER_ID"],
    project_id         : dartDefines["SP_FCM_PROJECT_ID"],
]
def hasFcm = fcmResources.values().every { it }

android {
    namespace = "id.co.garda.tablet"
    compileSdk = flutter.compileSdkVersion

    // AGP 9 disables resValue by default; the FCM resources below need it.
    buildFeatures {
        resValues = true
    }

    compileOptions {
        // flutter_local_notifications needs core library desugaring.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "id.co.garda.tablet"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // From pubspec `version:` (name+code) or --build-name/--build-number (CI).
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        if (hasFcm) {
            fcmResources.each { name, value -> resValue "string", name, value }
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // R8 keep rules of flutter_local_notifications (Gson).
            proguardFiles "proguard-rules.pro"
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

// Fail early and clearly instead of producing a debug-signed or unsigned
// release APK.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }
    if (!releaseTasks.isEmpty() && !hasReleaseKey && !allowDebugSigning) {
        throw new GradleException("Release build without android/key.properties. Provide the release keystore (see mobile/README.md) or, for a local test only, set SP_ALLOW_DEBUG_SIGNING=true.")
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
