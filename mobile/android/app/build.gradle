plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing (MOB-7). android/key.properties (never committed; CI writes
// it from secrets) holds storeFile (relative to android/app), storePassword,
// keyAlias and keyPassword. Without it a release build FAILS instead of being
// signed with the debug key. For a local `flutter run --release` only, set
// SP_ALLOW_DEBUG_SIGNING=true (or the Gradle property allowDebugSigning=true).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}
def allowDebugSigning = (project.findProperty("allowDebugSigning") ?: System.getenv("SP_ALLOW_DEBUG_SIGNING") ?: "false").toString().toBoolean()

android {
    namespace = "id.co.garda.tablet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "id.co.garda.tablet"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // From pubspec `version:` (name+code) or --build-name/--build-number (CI).
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

// Fail early and clearly instead of producing a debug-signed or unsigned
// release APK.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }
    if (!releaseTasks.isEmpty() && !hasReleaseKey && !allowDebugSigning) {
        throw new GradleException("Release build without android/key.properties. Provide the release keystore (see mobile/README.md) or, for a local test only, set SP_ALLOW_DEBUG_SIGNING=true.")
    }
}

flutter {
    source = "../.."
}
