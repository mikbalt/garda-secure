name: securepatrol
description: SecurePatrol — shared post tablet app for security guards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  bcrypt: ^1.1.3
  uuid: ^4.5.1
  intl: ^0.19.0
  cryptography: ^2.9.0
  timezone: ^0.10.1
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  flutter_local_notifications: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    # Optional private CA of the installation (assets/certs/README.txt, MOB-8).
    - assets/certs/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
