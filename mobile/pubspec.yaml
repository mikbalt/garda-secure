name: securepatrol
description: SecurePatrol mobile guard management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  qr_code_scanner: ^1.0.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
