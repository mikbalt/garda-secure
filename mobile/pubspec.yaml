name: securepatrol
description: GARDA — shared post tablet app for security guards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^7.3.1
  mobile_scanner: ^6.0.0
  geolocator: ^13.0.1
  image_picker: ^1.2.4
  bcrypt: ^1.1.3
  uuid: ^4.5.1
  intl: ^0.20.3
  cryptography: ^2.9.0
  timezone: ^0.11.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Optional private CA of the installation (assets/certs/README.txt, MOB-8).
    - assets/certs/
    # App icon, shown as the in-app brand mark (generated by branding/generate.sh).
    - assets/brand/icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icons, generated from ../branding/icon.svg by branding/generate.sh
# (which runs `dart run flutter_launcher_icons`). Do not edit the generated
# mipmaps / AppIcon set by hand; replace branding/icon.svg instead.
flutter_launcher_icons:
  image_path: "../branding/icon-1024.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_foreground: "../branding/generated/android-foreground.png"
  adaptive_icon_background: "../branding/generated/android-background.png"
  ios: true
  remove_alpha_ios: true
