# golangci-lint v2 configuration (backend/). gosimple and stylecheck are part
# of staticcheck in v2; gofmt/goimports are formatters.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        - G107 # URL provided to HTTP request as taint input (acceptable for JWKS fetch)
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
