name: CI — Mobile

# Flutter tablet app (D-024). Analyze + test on every change; a signed
# release APK on version tags (v*) or manual runs (INF-C6).
on:
  push:
    # `branches` must be listed too, otherwise defining `tags` would stop
    # branch pushes from triggering. Path filters do not apply to tags.
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.24.5'

# Actions are pinned by commit SHA (INF-C2); Dependabot keeps them current.
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter pub get (lockfile enforced once committed)
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile
          else echo "::warning::mobile/pubspec.lock is not committed yet (INF-C6)"; flutter pub get; fi
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: flutter pub get (lockfile enforced once committed)
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile
          else echo "::warning::mobile/pubspec.lock is not committed yet (INF-C6)"; flutter pub get; fi
      - run: flutter test

  build-apk:
    name: Build APK (debug smoke)
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: flutter pub get (lockfile enforced once committed)
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile
          else echo "::warning::mobile/pubspec.lock is not committed yet (INF-C6)"; flutter pub get; fi
      # Dummy push values: proves the Gradle side of the FCM dart-defines
      # (android/app/build.gradle writes them as Firebase resources) on every
      # change, not only on release tags. This APK is not published.
      - name: flutter build apk --debug (with dummy FCM defines)
        run: >-
          flutter build apk --debug
          --dart-define=SP_FCM_API_KEY=ci-dummy-key
          --dart-define=SP_FCM_APP_ID=1:000000000000:android:0000000000000000
          --dart-define=SP_FCM_PROJECT_ID=ci-dummy
          --dart-define=SP_FCM_SENDER_ID=000000000000

  release-apk:
    name: Release APK (signed)
    needs: [analyze, test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in `if:`; expose whether signing is configured.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Signing secrets missing — release skipped
        if: env.HAS_SIGNING != 'true'
        working-directory: .
        run: |
          echo "::notice title=Release APK skipped::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (Settings → Secrets → Actions) to build a signed release APK. A debug-signed APK is never published."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SIGNING == 'true'
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.HAS_SIGNING == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: env.HAS_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Version from tag / run number
        if: env.HAS_SIGNING == 'true'
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)-dev"
          fi
          printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::bad version '$name'"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Write keystore + key.properties (never committed)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Bundle the installation's private CA (optional)
        if: env.HAS_SIGNING == 'true'
        env:
          CA_PEM: ${{ secrets.SECUREPATROL_CA_PEM }}
        run: |
          if [ -n "$CA_PEM" ]; then
            mkdir -p assets/certs
            printf '%s\n' "$CA_PEM" > assets/certs/securepatrol-ca.crt
            echo "Bundled private CA ($(grep -c 'BEGIN CERTIFICATE' assets/certs/securepatrol-ca.crt) cert)."
          else
            echo "::notice::SECUREPATROL_CA_PEM not set: the APK trusts system CAs only (fine with a public certificate)."
          fi

      - name: flutter build apk --release
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
          # Push (Firebase Cloud Messaging, mobile/README.md). Optional: without
          # all four the APK has push disabled and polls as before.
          SP_FCM_API_KEY: ${{ secrets.SP_FCM_API_KEY }}
          SP_FCM_APP_ID: ${{ secrets.SP_FCM_APP_ID }}
          SP_FCM_PROJECT_ID: ${{ secrets.SP_FCM_PROJECT_ID }}
          SP_FCM_SENDER_ID: ${{ secrets.SP_FCM_SENDER_ID }}
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          defines=()
          if [ -n "$SP_FCM_API_KEY" ] && [ -n "$SP_FCM_APP_ID" ] && [ -n "$SP_FCM_PROJECT_ID" ] && [ -n "$SP_FCM_SENDER_ID" ]; then
            for k in SP_FCM_API_KEY SP_FCM_APP_ID SP_FCM_PROJECT_ID SP_FCM_SENDER_ID; do
              defines+=("--dart-define=$k=${!k}")
            done
            echo "Push (FCM) enabled for Firebase project $SP_FCM_PROJECT_ID."
          else
            echo "::notice title=Push disabled::Set SP_FCM_API_KEY, SP_FCM_APP_ID, SP_FCM_PROJECT_ID and SP_FCM_SENDER_ID (Settings → Secrets → Actions) to build the APK with push notifications. Without them tablets rely on polling."
          fi
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" "${defines[@]}"

      - name: Verify the APK is signed with the release key (not the debug key)
        if: env.HAS_SIGNING == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          expected=$(keytool -exportcert -keystore android/app/upload-keystore.jks -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          echo "APK signer:  $signer"
          echo "Release key: $expected"
          if [ "$signer" != "$expected" ]; then
            echo "::error::The APK is not signed with the release key. android/app/build.gradle must read android/key.properties into signingConfigs.release (MOB-7)."
            exit 1
          fi

      - name: Collect artifact
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist
          out="dist/securepatrol-tablet-${BUILD_NAME}+${BUILD_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          rm -f android/key.properties android/app/upload-keystore.jks

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_SIGNING == 'true'
        with:
          name: securepatrol-tablet-${{ steps.version.outputs.name }}
          path: mobile/dist/
          retention-days: 90
