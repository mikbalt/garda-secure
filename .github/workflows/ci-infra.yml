name: CI — Infra

on:
  push:
    paths:
      - 'infra/**'
      - 'web/nginx.conf'
      - 'web/nginx-security-headers.conf'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'web/nginx.conf'
      - 'web/nginx-security-headers.conf'
      - '.github/workflows/ci-infra.yml'

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra

env:
  CI_HOST: ci.securepatrol.internal

# Static validation of everything in infra/. The real boot test is
# ci-e2e-stack.yml. Image tags below must match the compose files.
jobs:
  scripts:
    name: Shell scripts + env/cert tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --shell=sh --severity=warning scripts/*.sh keycloak/new-realm.sh postgres/init/*.sh minio/*.sh \
            nginx/docker-entrypoint.d/*.sh backup-offsite/*.sh backup-offsite/offsite-health \
            alertmanager/entrypoint.sh ../web/docker-entrypoint.d/*.sh
      - name: make env / certs / preflight
        run: |
          make env SERVER_HOST="$CI_HOST"
          make certs
          openssl x509 -in nginx/certs/cert.pem -noout -checkhost "$CI_HOST" | grep -q 'does match'
          openssl verify -CAfile nginx/certs/ca.pem nginx/certs/cert.pem
          make preflight
      - name: preflight rejects the defaults
        run: |
          if sh scripts/preflight.sh .env.example; then
            echo "preflight accepted .env.example" >&2; exit 1
          fi
      - name: new-realm.sh produces valid JSON with the server's redirect URI
        run: |
          ./keycloak/new-realm.sh securepatrol-ci-test "PT \"Quote\" / Test"
          f=keycloak/realms/securepatrol-ci-test.json
          jq -e --arg u "https://$CI_HOST/*" \
            '.realm == "securepatrol-ci-test" and (.clients[] | select(.clientId == "securepatrol-web") | .redirectUris == [$u])' "$f"
          rm "$f"

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every ${VAR} used by the compose files is documented in .env.example
        run: |
          used=$(grep -hoE '[$][{][A-Z_][A-Z0-9_]*' docker-compose*.yml | cut -c3- | sort -u)
          missing=""
          for v in $used; do
            grep -q "^$v=" .env.example || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "not in .env.example:$missing" >&2; exit 1; }
      - name: docker compose config (full stack via COMPOSE_FILE, infra-only, local override)
        run: |
          sh scripts/gen-env.sh "$CI_HOST"
          # normally created by make preflight
          mkdir -p secrets && : > secrets/keycloak-admin-clients && : > secrets/fcm-service-account.json
          docker compose config --quiet
          docker compose config --services | sort | tee /tmp/services
          for s in api notification-worker web nginx postgres redis minio minio-init keycloak \
                   prometheus alertmanager grafana node-exporter cadvisor postgres-exporter \
                   redis-exporter blackbox-exporter backup-offsite; do
            grep -qx "$s" /tmp/services || { echo "service $s missing" >&2; exit 1; }
          done
          docker compose -f docker-compose.yml config --quiet
          COMPOSE_FILE=docker-compose.yml:docker-compose.app.yml:docker-compose.ops.yml:docker-compose.local.yml \
            docker compose config --quiet

  validate-keycloak-realms:
    name: Validate Keycloak realm files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse realm JSON
        run: for f in keycloak/realm-template.json keycloak/realms/*.json; do jq empty "$f"; done
      - name: Realm clients match the Keycloak 26 token contract (D-032)
        run: |
          for f in keycloak/realm-template.json keycloak/realms/*.json; do
            echo "$f"
            jq -e '
              def client($id): first(.clients[] | select(.clientId == $id));
              (client("securepatrol-web") | .fullScopeAllowed == false and .publicClient and .directAccessGrantsEnabled == false
                 and .attributes["pkce.code.challenge.method"] == "S256")
              and (client("securepatrol-tablet") | .fullScopeAllowed == false and .publicClient and .directAccessGrantsEnabled
                 and .standardFlowEnabled == false and (.defaultClientScopes | index("basic"))
                 and (.optionalClientScopes | index("offline_access")))
              and ([.clients[].protocolMappers[]? | select(.name == "realm roles (flat)") | .config["claim.name"]] == ["roles", "roles"])
              and ([.scopeMappings[] | select(.client == "securepatrol-tablet") | .roles[]] == ["device"])
              and ([.scopeMappings[] | select(.client == "securepatrol-web") | .roles[]] | sort
                   == (["platform-admin", "admin", "supervisor", "hr", "client-readonly"] | sort))
            ' "$f" >/dev/null
          done
      - name: Keycloak image is a pinned 26.x
        run: |
          grep -Eq '^ +image: quay\.io/keycloak/keycloak:26\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$' docker-compose.yml

  validate-nginx:
    name: Validate Nginx configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nginx -t (edge, incl. generated includes; web container; infra-only)
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -subj "/CN=ci" \
            -keyout /tmp/certs/key.pem -out /tmp/certs/cert.pem
          # The official entrypoint runs docker-entrypoint.d/40-securepatrol.sh
          # (admin allow-list + photos location) before `nginx -t`.
          docker run --rm \
            -e ADMIN_ALLOW_CIDRS="10.0.0.0/8 192.168.0.0/16 127.0.0.1/32" \
            -e MINIO_BUCKET_PHOTOS=securepatrol-photos \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/nginx/docker-entrypoint.d/40-securepatrol.sh:/docker-entrypoint.d/40-securepatrol.sh:ro" \
            -v /tmp/certs:/etc/nginx/certs:ro \
            nginx:1.30-alpine nginx -t
          # An invalid allow-list entry must stop the container.
          if docker run --rm -e ADMIN_ALLOW_CIDRS="10.0.0.0/8; deny none" \
               -v "$PWD/nginx/docker-entrypoint.d/40-securepatrol.sh:/docker-entrypoint.d/40-securepatrol.sh:ro" \
               nginx:1.30-alpine nginx -t; then
            echo "invalid ADMIN_ALLOW_CIDRS was accepted" >&2; exit 1
          fi
          docker run --rm \
            -v "$PWD/../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/../web/nginx-security-headers.conf:/etc/nginx/snippets/web-security-headers.conf:ro" \
            nginx:1.30-alpine nginx -t
          docker run --rm \
            -v "$PWD/nginx/nginx-infra-only.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30-alpine nginx -t

  validate-monitoring:
    name: Validate Prometheus / Alertmanager / Blackbox / Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check config + rules
        run: |
          mkdir -p /tmp/prom
          SERVER_HOST="$CI_HOST" awk -f scripts/render.awk prometheus/prometheus.yml.tmpl > /tmp/prom/prometheus.yml
          if grep -n '__[A-Z][A-Z0-9_]*__' /tmp/prom/prometheus.yml; then
            echo "unrendered placeholder" >&2; exit 1
          fi
          docker run --rm --entrypoint promtool \
            -v /tmp/prom/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
            -v "$PWD/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.13.4 check config /etc/prometheus/prometheus.yml
      - name: amtool check-config (e-mail and no-e-mail variants)
        run: |
          mkdir -p /tmp/am
          ALERT_SMTP_HOST=smtp.example.com ALERT_SMTP_PORT=587 ALERT_SMTP_FROM='Alerts <a@example.com>' \
          ALERT_SMTP_USER=u ALERT_SMTP_PASSWORD='p"w\d' ALERT_SMTP_REQUIRE_TLS=true \
          ALERT_EMAIL_TO=ops@example.com SERVER_HOST="$CI_HOST" \
            awk -f scripts/render.awk alertmanager/alertmanager.yml.tmpl > /tmp/am/email.yml
          cp alertmanager/alertmanager-noemail.yml /tmp/am/noemail.yml
          for f in email noemail; do
            docker run --rm --entrypoint amtool -v /tmp/am:/am:ro prom/alertmanager:v0.34.1 check-config "/am/$f.yml"
          done
      - name: blackbox config
        run: |
          docker run --rm -v "$PWD/blackbox/blackbox.yml:/b.yml:ro" prom/blackbox-exporter:v0.29.0 \
            --config.file=/b.yml --config.check
      - name: Grafana dashboards / provisioning are valid
        run: |
          for f in grafana/dashboards/*.json; do jq -e '.uid and .title and (.panels | length > 0)' "$f" >/dev/null; done
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            grafana/provisioning/datasources/*.yml grafana/provisioning/dashboards/*.yml \
            blackbox/blackbox.yml prometheus/alerts.yml alertmanager/alertmanager-noemail.yml
