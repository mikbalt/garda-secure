# Dependency updates (INF-C4). PRs target the integration branch `init`.
# Minor/patch updates are grouped per ecosystem to keep the PR count low for a
# one-person team; majors arrive as separate PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /web
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pub
    directory: /mobile
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Base images of our own Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /backend
      - /web
      - /infra/backup-offsite
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  # Images pinned in infra/docker-compose*.yml. Keycloak major upgrades need
  # the migration in docs/runbook.md §9 — do not merge those blindly.
  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: init
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "quay.io/keycloak/keycloak"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
