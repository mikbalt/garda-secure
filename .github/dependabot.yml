# Dependency updates (INF-C4), tuned for a one-person team (docs/maintenance.md):
# - once a month, ONE grouped PR per ecosystem with minor/patch updates only;
# - major versions are never proposed here: they are planned upgrades done on
#   purpose (list in docs/maintenance.md), because they can break the build;
# - components that need a manual procedure are excluded (see comments).
# All PRs target the integration branch `init`.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: init
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm
    directory: /web
    target-branch: init
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Keycloak's JS adapter follows the Keycloak server upgrade (runbook §2).
      - dependency-name: "keycloak-js"
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  # Paused (limit 0): new plugin versions need a newer Flutter than 3.24, so
  # every PR fails. Re-enable (limit 2) right after the Flutter upgrade.
  - package-ecosystem: pub
    directory: /mobile
    target-branch: init
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned by the Flutter SDK (flutter_test / flutter_localizations): they
      # move only with a Flutter upgrade, otherwise `pub get` fails.
      - dependency-name: "path"
      - dependency-name: "intl"
      # Firebase/notifications are pinned to versions that build with
      # Flutter 3.24 + AGP 8.1 (D-057); upgrade together with Flutter.
      - dependency-name: "firebase_*"
      - dependency-name: "flutter_local_notifications"
      - dependency-name: "geolocator_android"
    groups:
      pub-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    target-branch: init
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }

  # Base images of our own Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /backend
      - /web
      - /infra/backup-offsite
    target-branch: init
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Go comes from backend/go.mod and the toolchain policy (D-031); the
      # builder image moves with it, not on its own.
      - dependency-name: "golang"
      # nginx: odd minors (1.31, 1.33, …) are "mainline"; we stay on stable.
      - dependency-name: "nginx"
        update-types: ["version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]
    commit-message: { prefix: "chore(deps)" }

  # Images pinned in infra/docker-compose*.yml.
  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: init
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-minor"]
      # Every Keycloak update migrates its database one way: only with the
      # procedure in docs/runbook.md §2 ("Upgrading Keycloak").
      - dependency-name: "quay.io/keycloak/keycloak"
      - dependency-name: "keycloak/keycloak"
    groups:
      stack-images:
        patterns: ["*"]
    commit-message: { prefix: "chore(deps)" }
